<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setup Profile - Soulnotes</title>
  <link rel="stylesheet" href="assets/setup-profile.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=The+Seasons&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="profile-container">
    <h1>Setup Your Profile</h1>
    <form id="profileForm">
      <input type="text" id="nickname" placeholder="Create an anonymous nickname" required />
      
      <select id="gender" required>
        <option value="">Select your gender</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Prefer not to say">Prefer not to say</option>
      </select>

      <label>Birthdate (Month & Year required)</label>
      <div class="birthdate">
        <select id="birthMonth" required>
          <option value="">Month</option>
          ${[..."January February March April May June July August September October November December".split(" ")].map((m, i) => `<option value="${i+1}">${m}</option>`).join("")}
        </select>
        <select id="birthYear" required>
          <option value="">Year</option>
          ${Array.from({ length: 100 }, (_, i) => {
            const y = new Date().getFullYear() - i;
            return `<option value="${y}">${y}</option>`;
          }).join("")}
        </select>
        <input type="number" id="birthDay" placeholder="Day (optional)" min="1" max="31" />
      </div>

      <button type="submit">Finish Setup</button>
    </form>
  </div>

  <script type="module" src="assets/setup-profile.js"></script>
</body>
</html>
