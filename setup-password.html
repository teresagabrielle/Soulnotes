<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setup Password - Soulnotes</title>
  <link rel="stylesheet" href="assets/setup-password.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=The+Seasons&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="container">
    <h1 class="title">Soulnotes</h1>
    <p class="subtitle">Create your admin password</p>

    <div class="password-wrapper">
      <input type="password" id="passwordInput" placeholder="Create Password (min 8 characters)" required />
      <span id="togglePassword" class="toggle-password">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" width="24" height="24" viewBox="0 0 24 24" stroke="currentColor">
          <path id="eyeMain" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path id="eyeOutline" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          <path id="eyeSlash" style="display: none;" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4l16 16" />
        </svg>
      </span>
    </div>

    <button id="setPasswordBtn">Set Password</button>
  </div>

  <script type="module" src="assets/setup-password.js"></script>
</body>
</html>
