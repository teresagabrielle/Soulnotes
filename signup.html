<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="assets/signup.css">
</head>
<body>
  <h1>Sign Up</h1>
  <form id="signUpForm">
    <label for="signupEmail">Email:</label>
    <input type="email" id="signupEmail" placeholder="Enter your email" required />

    <label for="signupNickname">Nickname:</label>
    <input type="text" id="signupNickname" placeholder="Enter your nickname" required />

    <div class="buttons">
      <button type="submit">Sign Up</button>
      <button type="button" id="skipBtn">Skip</button>  <!-- Opsi Skip -->
    </div>
  </form>

  <p>Already have an account? <a href="index.html">Login</a></p>

  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"></script>
  <script src="assets/signup.js"></script>
</body>
</html>
