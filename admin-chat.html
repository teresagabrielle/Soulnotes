<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Chat Panel - Soulnotes</title>
  <link rel="stylesheet" href="assets/admin-chat.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=The+Seasons&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-chat-container">
    <div class="user-list" id="userList">
      <h2>Users</h2>
      <!-- List user masuk ke sini -->
    </div>

    <div class="chat-panel">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/admin-chat.js"></script>
</body>
</html>
